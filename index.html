<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (desc && desc.get && !desc.set && desc.configurable) {
            var overrideFetch = null;
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: desc.enumerable,
              get: function () {
                return overrideFetch || desc.get.call(window);
              },
              set: function (fn) {
                if (typeof fn === 'function') {
                  overrideFetch = fn;
                }
              },
            });
          }
        } catch (e) {
          // Ignore if window.fetch is non-configurable
        }

        window.addEventListener(
          'error',
          function (event) {
            var src = event && event.filename ? String(event.filename) : '';
            var msg = event && event.message ? String(event.message) : '';
            if (
              src.indexOf('chrome-extension://') === 0 ||
              msg.indexOf('Cannot set property fetch of #<Window>') !== -1
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );
      })();
    </script>
